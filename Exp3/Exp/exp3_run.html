<!DOCTYPE html>
<html>
<head>
    <title>Rock classification experiment</title>

    <!-- Plugins -->
    <script src="https://unpkg.com/jspsych@8.2.2"></script> <!-- jsPsych -->
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script> <!-- Preload images -->
    <script src="https://unpkg.com/@jspsych/plugin-categorize-image@2.1.0"></script> <!-- Categorize images -->
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script> <!-- Fullscreen mode -->
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script> <!-- Buttons & html -->
    <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script> <!-- DataPipe -->
    <script src="https://unpkg.com/@jspsych/plugin-browser-check@2.1.0"></script> <!-- Device check -->
    <script src="https://unpkg.com/@jspsych/plugin-external-html@2.1.0"></script> <!-- External html -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script> <!-- Text & keyboard responses -->

    <!-- Custom files -->
    <script src="src/config.js"></script> <!-- high-level variables -->
    <script src="src/instructions.js"></script> <!-- instructions -->
    <script src="src/utils.js"></script> <!-- functions -->

    <!-- CSS -->
    <link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <style>
        /*Make buttons prettier*/
        .jspsych-btn {
            margin-top: 5px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: auto;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        /* Change button color on hover */
        .jspsych-btn:hover {
            background-color: #0056b3;
        }
        /* Set image size */
        #jspsych-categorize-image-stimulus {
            height: var(--img-size);
            width: auto;
        }
    </style>

    <!-- Set image size (now in JS - before we referenced it in CSS) -->
    <script>
        document.documentElement.style.setProperty('--img-size', img_size + 'px');
    </script>

</head>
<body></body>
<script>

    // Everything below (subject ID, condition assignment, filename) is resolved
    // BEFORE initJsPsych() is called, for two reasons:
    // 1. The pipe extension resolves its `filename` param synchronously when it
    //    initializes. If initJsPsych() ran before we knew the condition/subject info,
    //    the extension would silently fall back to an auto-generated DataPipe session
    //    name instead of our intended `<condition>_<subject_id>_<date>_<time>.json`.
    // 2. jsPsychExtensionPipe.getCondition() is a standalone static method (it doesn't
    //    need a jsPsych instance), and the jsPsych docs explicitly call it before
    //    initJsPsych() in their own examples.

    // Subject ID
    // extract ID from URL parameters (Prolific or Sona) or generate random ID
    // (plain URLSearchParams here, since jsPsych doesn't exist yet at this point)
    const url_params = new URLSearchParams(window.location.search);
    const prolific_pid = url_params.get('PROLIFIC_PID');
    const sona_id = url_params.get('id');

    let recruitment_source, subject_id, study_id, session_id;

    if (prolific_pid) {
        recruitment_source = 'prolific';
        subject_id = prolific_pid;
        study_id = url_params.get('STUDY_ID') ?? 'random_' + randomID(8);
        session_id = url_params.get('SESSION_ID') ?? 'random_' + randomID(8);
    } else if (sona_id) {
        recruitment_source = 'sona';
        subject_id = sona_id;
        study_id = 'random_' + randomID(8);
        session_id = 'random_' + randomID(8);
    } else {
        recruitment_source = 'unknown';
        subject_id = 'random_' + randomID(8);
        study_id = 'random_' + randomID(8);
        session_id = 'random_' + randomID(8);
    }

    // Get condition and study items
    // Use DataPipe API for balanced data collection
    async function get_condition() {
        let condition_num;
        let cond_assign_source = "DataPipe"; // default to DataPipe

        try { condition_num = await jsPsychExtensionPipe.getCondition(DataPipe_Exp_ID);}
        catch (error) { console.warn("DataPipe condition assignment failed:", error); }

        // Fallback if DataPipe returns undefined or fails
        if (condition_num === undefined || condition_num === null) {
            console.warn("Falling back to random condition assignment");
            condition_num = Math.floor(Math.random() * 2);
            cond_assign_source = "Random";
        }

        const condition = ["low", "high-sub-prototype"][condition_num];

        const train_image_id = condition === "low"
            ? [4, 6, 16, 33, 35, 37, 52, 56, 71, 80,
               353, 356, 387, 396, 408, 409, 411, 424, 465, 471]
            : [6, 17, 48, 56, 66, 84, 97, 119, 131, 149,
               330, 348, 353, 372, 396, 411, 432, 448, 460, 469];

        return { condition, cond_assign_source, train_image_id };
    }

    // Function to run trials (assumes jsPsych, condition and train_image_id are already set)
    async function runTrials() {

        // Read CSV
        const response = await fetch(stim_table_file);
        const csvText = await response.text();

        // Parse CSV into array of objects
        const all_rows = csvText.trim().split('\n').map(row => row.split(','));
        const headers = all_rows[0];
        const all_stim_table = all_rows.slice(1).map(row => {
            let obj = {};
            headers.forEach((header, i) => obj[header.trim()] = row[i].trim());
            return obj;
        });

        // Filter study images
        const study_table = all_stim_table.filter(row =>
            train_image_id.includes(parseInt(row.image_id))
        );
        study_table.forEach(row => {
            row.full_path = `${img_folder}${encodeURIComponent(row.filename)}`; // add full path to img (encode: some filenames contain spaces)
            row.object_type = 'study'; // Always a study object
        });

        // Test images
        const test_table = all_stim_table.map(row => ({
            ...row,
            full_path: `${img_folder}${encodeURIComponent(row.filename)}`, // add full path to img (encode: some filenames contain spaces)
            object_type: train_image_id.includes(parseInt(row.image_id)) ? 'study' : 'novel' // Study or Novel object
        }));


        // Preload img, in batches rather than one request burst for all ~320 files.
        // Firing every image at once overwhelmed the CDN: some images silently never
        // finished preloading (continue_after_error let the experiment proceed anyway),
        // and those specific images then had to load live during test-phase trials —
        // showing up as multi-second delays or missing images for the participant.
        const all_image_urls = test_table.map(row => row.full_path); // study + test images
        const PRELOAD_BATCH_SIZE = 40;
        const preload_trials = [];
        for (let i = 0; i < all_image_urls.length; i += PRELOAD_BATCH_SIZE) {
            const batch = all_image_urls.slice(i, i + PRELOAD_BATCH_SIZE);
            const loaded_so_far = Math.min(i + PRELOAD_BATCH_SIZE, all_image_urls.length);
            preload_trials.push({
                type: jsPsychPreload,
                images: batch,
                message: `<p style="font-size:${instructions_font_size}px;">Experiment is loading... (${loaded_so_far}/${all_image_urls.length})</p>`,
                continue_after_error: true, // don't hard-block the whole experiment over a handful of failed image loads
                on_start: function() {
                    var progressBar = document.querySelector('#jspsych-progressbar-container');
                    if (progressBar) progressBar.style.display = 'none';
                },
            });
        }

        // Study phase
        const study_trial = {
            type: jsPsychCategorizeImage,
            stimulus: jsPsych.timelineVariable('full_path'),
            key_answer: jsPsych.timelineVariable('category'),
            choices: ['I', 'S'],
            correct_text: function() {
                const cat = jsPsych.evaluateTimelineVariable('category');
                const full_name = cat === 'I' ? 'Igneous' : 'Sedimentary';
                return `<p class='prompt' style="color:green; font-size:${caption_font_size}px">Correct! It is <b>${full_name}</b></p>`;
            },
            incorrect_text: function() {
                const cat = jsPsych.evaluateTimelineVariable('category');
                const full_name = cat === 'I' ? 'Igneous' : 'Sedimentary';
                return `<p class='prompt' style="color:red; font-size:${caption_font_size}px">Wrong! It is <b>${full_name}</b></p>`;
            },
            show_stim_with_feedback: true,
            trial_duration: null,
            feedback_duration: feedback_dur,
            prompt: `<p style="font-size:${caption_font_size}px">
                        <b>(S)</b>edimentary or <b>(I)</b>gneous?
                    </p>`,
            post_trial_gap: isi,
            data: {
                task: 'study',
                image_id: jsPsych.timelineVariable('image_id'),
                filename: jsPsych.timelineVariable('filename'),
                category: jsPsych.timelineVariable('category'),
                sub_category: jsPsych.timelineVariable('sub_category'),
                sub_cat_item: jsPsych.timelineVariable('sub_cat_item'),
                object_type: jsPsych.timelineVariable('object_type'),
                block: jsPsych.timelineVariable('block'),
            },
            on_finish: function(data) {
                const trials_done = jsPsych.data.get().filter({task: 'study'}).count();
                const progress = trials_done / total_study_img;
                updateProgressBar(progress, 'Study Phase');
            }
        };


        // Categories present in the study set (derived, not hardcoded to 'I'/'S')
        const study_categories = [...new Set(study_table.map(row => row.category))];

        // Build the trial list + jsPsych timeline node for a given study block.
        // Block 1 is non-adaptive (every stimulus once). From block 2 onward, stimuli
        // are drawn via recency-weighted adaptive sampling, separately per category,
        // based on all responses collected in previous blocks.
        function buildStudyBlockNode(blockNum) {
            let sampled_rows;

            if (blockNum === 1) {
                sampled_rows = study_table; // one presentation of each of the 20 stimuli
            } else {
                const history = jsPsych.data.get().filter({ task: 'study' }).values();
                const completedBlocks = blockNum - 1;
                const weights = computeSamplingWeights(
                    history, study_table, completedBlocks, recency_lambda, exploration_epsilon
                );

                sampled_rows = [];
                study_categories.forEach(function(cat) {
                    const items_for_cat = study_table.filter(row => row.category === cat);
                    const drawn = weightedSampleWithCap(
                        items_for_cat, weights, study_img_per_cat, max_reps_per_block
                    );
                    sampled_rows = sampled_rows.concat(drawn);
                });
            }

            // Copy rows (don't mutate the shared study_table) and tag with the block number.
            const block_timeline_variables = sampled_rows.map(row => ({ ...row, block: blockNum }));

            return {
                timeline: [study_trial, fast_warning, slow_warning],
                timeline_variables: block_timeline_variables,
                randomize_order: true, // randomize order within a block
                on_timeline_finish: function() {
                    if (blockNum < n_study_blocks) {
                        study_blocks_array.push(buildStudyBlockNode(blockNum + 1));
                    }
                }
            };
        }

        // Self-extending array: each block, once finished, pushes the next (adaptively
        // built) block onto this same array reference, which jsPsych keeps reading from.
        let study_blocks_array = [buildStudyBlockNode(1)];

        const study_phase = {
            timeline: study_blocks_array,
            on_timeline_start: function() {
                document.body.style.cursor = 'none';
                setTimeout(() => updateProgressBar(0, 'Study Phase'), 100);
            },
            on_timeline_finish: function() {
                document.body.style.cursor = 'default';
            }
        };

        // Test phase
        const test_trial = {
            type: jsPsychCategorizeImage,
            stimulus: jsPsych.timelineVariable('full_path'),
            stimulus_height: img_size,
            key_answer: jsPsych.timelineVariable('category'),
            choices: ['I', 'S'],
            correct_text: '', // no feedback
            incorrect_text: '', // no feedback
            feedback_duration: 0,
            trial_duration: null,
            prompt: `<p style="font-size:${caption_font_size}px">
                        <b>(S)</b>edimentary or <b>(I)</b>gneous?
                    </p>`,
            post_trial_gap: isi,
            data: {
                task: 'test',
                image_id: jsPsych.timelineVariable('image_id'),
                filename: jsPsych.timelineVariable('filename'),
                category: jsPsych.timelineVariable('category'),
                sub_category: jsPsych.timelineVariable('sub_category'),
                sub_cat_item: jsPsych.timelineVariable('sub_cat_item'),
                object_type: jsPsych.timelineVariable('object_type'),
            },
            on_finish: function(data) {
                const trials_done = jsPsych.data.get().filter({task: 'test'}).count();
                const progress = trials_done / test_table.length;
                updateProgressBar(progress, 'Test Phase');
            }
        };

        const test_phase = {
            timeline: [test_trial, fast_warning, slow_warning],
            timeline_variables: test_table,
            randomize_order: true,
            on_timeline_start: function() {
                document.body.style.cursor = 'none';
                setTimeout(() => updateProgressBar(0, 'Test Phase'), 100);
            },
            on_timeline_finish: function() {
                document.body.style.cursor = 'default';
            }
        };


        // Data saving is handled automatically by the pipe extension (registered in
        // initJsPsych, inside main() below) at the end of the experiment — no separate
        // save trial needed.

        // Build and run timeline
        let timeline = [];
        timeline.push(
            device_check,
            consentTrial,
            enter_fullscreen,
            ...preload_trials,
            instructions,
            study_phase,
            between_phases,
            test_phase,
            exit_fullscreen
        );
        jsPsych.run(timeline);
    }

    // Orchestrate startup: resolve condition (and the filename that depends on it)
    // BEFORE initializing jsPsych, so the pipe extension always saves under the
    // intended filename instead of an auto-generated fallback (see comment near the
    // top of this script for why).
    let jsPsych, condition, train_image_id, saved_filename;

    async function main() {
        const result = await get_condition();
        condition = result.condition;
        train_image_id = result.train_image_id;

        // Filename format example: low_88301_2025-11-06_16-13-26.json
        saved_filename = `${condition}_${subject_id}_${date}_${saved_at}.json`;

        // Debrief content shown by the pipe extension's done_message, once data submission
        // has finished (see src/debrief.html). Fetched now so it's ready before jsPsych.run().
        const debrief_response = await fetch(debrief_file);
        const debrief_html = await debrief_response.text();

        // Begin Experiment
        jsPsych = initJsPsych({
            show_progress_bar: true, // show progress bar
            auto_update_progress_bar: false, // We'll update manually
            message_progress_bar: '', // We'll set manually
            case_sensitive_responses: false, // responses are NOT case sensitive
            extensions: [
                {
                    type: jsPsychExtensionPipe,
                    params: {
                        experiment_id: DataPipe_Exp_ID,
                        stream: false, // don't upload after every trial; save once, at the end
                        filename: () => saved_filename,
                        format: "json",
                        done_message: debrief_html, // shown once submission finishes (see src/debrief.html)
                        on_save: (save_result) => {
                            if (!save_result.ok) {
                                console.error('DataPipe save failed:', save_result);
                            }
                        }
                    }
                }
            ],
            on_finish: function(){
                // redirect for Prolific participants
                if (recruitment_source === 'prolific') {
                    window.location = Prolific_completion_url;
                }
            }
        });

        // Save date, subject and condition info
        jsPsych.data.addProperties({
            full_date: full_date,
            date: date,
            time: time,
            subject_id: subject_id,
            study_id: study_id,
            session_id: session_id,
            condition: condition,
            cond_assign_source: result.cond_assign_source
        });

        runTrials(); // Run experiment
    }

    main();

</script>
</html>
